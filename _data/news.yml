- title: 创维数字与Google达成智能家居深度合作
  description: 36氪获悉，据创维数字消息，近日，公司与Google Asia Pacific Pte. Ltd（谷歌亚太有限公司，简称“Google”）正式签署《智能家居合作协议》。基于Google
    Home平台与Gemini AI大模型等能力，公司作为Google授权的智能家居合作伙伴及智能家居服务授权经销商，围绕智能家居产品及服务开展深度协同，共同推动智能产品创新与产业化商用的落地。
