- title: 南威软件成立健康科技新公司，含健康咨询服务等
  description: 36氪获悉，天眼查信息显示，8月18日，北京本宸国际健康科技有限公司成立，法定代表人为黄海峰，注册资本1000万元，注册地址位于北京经济技术开发区，经营范围包括物联网技术研发、电子专用材料研发、健康咨询服务、人工智能基础软件开发等。股东信息显示，该公司由北京茶寿国际健康科技有限公司全资持股，后者为南威软件旗下公司。
