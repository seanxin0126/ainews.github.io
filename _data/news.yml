- title: 陶哲轩等25位菲尔兹奖得主警告：AI与数学研究目标严重错位
  description: 当地时间9月11日，陶哲轩、邓煜等25位菲尔兹奖得主发表联合声明，警告人工智能快速用于解决数学问题可能使AI发展目标与数学研究目标“严重错位”。声明称，近年来大型语言模型解决重大数学问题的能力大幅提升，但AI企业将数学问题作为能力基准，可能损害数学研究和数学界。声明指出，数学研究的核心目标是形成概念理解和新洞见，而非单纯给出“正确或错误”的答案。AI快速批量生成数学成果，可能压缩成果验证、方法总结、学术交流和引用前人成果的时间，并引发严重的署名和抄袭问题。声明同时认为，AI也有潜力提升数学研究效率，最终影响将取决…
