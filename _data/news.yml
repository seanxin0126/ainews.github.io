- title: SK集团会长崔泰源：蔚山AI数据中心容量已扩大至近900兆瓦
  description: 据报道，SK集团会长崔泰源表示，该集团正在蔚山建设的AI数据中心容量已扩大至近900兆瓦。其补充称，随着项目推进，该集团计划宣布与全球科技公司建立更多合作伙伴关系。蔚山AI数据中心由SK集团与亚马逊AWS联合开发，预计投资7万亿韩元（52亿美元），计划于2027年下半年投入运营。（财联社）
