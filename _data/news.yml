- title: Anthropic Claude将兼容OpenAI的Markdown指令规范
  description: "人工智能行业围绕“标准化”的竞争正在出现新的转折。Anthropic日前宣布，将支持由OpenAI提出的Markdown指令规范，使开发者能够利用统一格式向不同AI模型传递行为规则和指令。这意味着原本属于竞争对手阵营的技术规范，正在逐渐演变为跨平台通用标准。\r\
    \n这项规范的核心目标是为AI系统建立统一的指令描述方式。开发者可以通过特定Markdown结构编写模型行为、任务要求以及运行约束，让不同厂商的大语言模型能够以相似方式理解和执行这些规则。过去，不同AI平台通常拥有各自独立的提示词格式和配置方法。开发者如果希望…"
