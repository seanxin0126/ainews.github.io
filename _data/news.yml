  description: 北京市广播电视局印发《北京市促进“人工智能+视听”产业高质量发展重点项目支持管理办法（2026—2029年）》，其中指出，支持视听大模型、智能体等在广电视听领域的研发应用，包括音视频内容生成大模型、内容生成智能体、内容生成多模型集成平台、创作辅助、虚拟制作、智能剪辑、智能修复/增强/替换、智能译制与配音等创新技术与系统。依照技术先进性和应用效果等进行评审，单个项目支持金额最高不超过300万元。（证券时报）
