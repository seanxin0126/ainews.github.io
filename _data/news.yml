- title: AI热潮蔓延至金刚石散热赛道，超硬材料企业跨界抢滩
  description: 人工智能（AI）热潮正蔓延到金刚石散热赛道。近几个月来，多家传统超硬材料上市公司密集发布投资及募投变更公告，纷纷切入金刚石散热赛道。据了解，随着相关项目先后落地，部分上市公司金刚石散热产品已经进入送样、小批量供货阶段。当前伴随AI大模型迭代带动服务器芯片功耗持续走高，传统铜铝散热材料逐步触碰物理性能天花板，CVD金刚石热沉被视作破解高功率芯片散热痛点的关键材料。在培育钻石、工业金刚石主业价格低迷、企业盈利承压的背景下，向半导体功能材料转型，成为超硬材料行业企业的现实选择。（证券时报）
  url: https://36kr.com/newsflashes/3988147333299205?f=rss
  source: 36kr.com
