- title: 上海：深化人工智能、大模型、区块链等技术在环境监测、环境监管、污染防治、生态修复等领域应用
  description: 36氪获悉，上海市人民政府近日印发《美丽上海建设“十五五”规划》。规划提出，提升美丽上海数智能力。构建生态环境保护智慧化治理体系，加强数据资源集成共享，整合构建一体化生态环境大数据底座，完善“一库、一屏、一中心”生态大脑。深化人工智能、大模型、区块链等技术在环境监测、环境监管、污染防治、生态修复等领域应用，开发10个生态环境数智化应用场景。生态环境业务数字化率达到90%。
