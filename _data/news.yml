- title: 铠侠反驳与SK海力士建立更深度合作关系的说法，承诺缓解芯片价格涨势
  description: 铠侠CEO反驳了有关与竞争对手和利益相关方SK海力士建立更深层次关系的说法，同时承诺控制内存价格飙升以避免损害人工智能的长期需求。内存芯片制造商纷纷斥巨资扩大产能，以满足人工智能服务提供商激增的订单需求，需求增长已推动芯片价格涨幅高达两位数甚至三位数。铠侠首席执行官太田裕雄表示，与SK海力士建立更紧密联系常常被提及，但这将会遇到反垄断障碍，而且对铠侠和闪迪的合资生产业务来说，也难以相互协调。铠侠需要找到其他方法来抑制内存价格的飙升。（新浪财经）
  url: https://36kr.com/newsflashes/3975605906534664?f=rss
  source: 36kr.com
