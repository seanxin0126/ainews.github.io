- title: 美国参议院委员会对OpenAI展开调查
  description: 据美国方面9月10日消息，美国参议院国土安全与政府事务委员会灾害管理小组委员会主席乔希·霍利9日致信美国开放人工智能研究中心（OpenAI）首席执行官奥尔特曼，表示正在因美国“抱抱脸”公司系统遭侵入事件对OpenAI展开调查。霍利表示，从OpenAI发布的内部调查报告看出，其对网络测试的处理方式是“鲁莽的”。他还指出，OpenAI对报告中有关这起事件的许多重要细节进行了编辑、删减。（央视新闻）
