  source: 36kr.com
- title: 欧盟拟限制15岁以下儿童独立注册社交平台，AI聊天机器人纳入安全监管
  description: 欧盟委员会正酝酿推出《欧盟儿童法案》（EU Kids Act）。据媒体获得的草案，未满15岁的用户原则上不得在社交媒体和视频分享平台独立开设账户，13岁至14岁儿童仅可在家长同意及严格限制下使用。人工智能聊天机器人、AI陪伴产品和网络游戏也被纳入监管，但草案目前主要要求这些服务落实适龄设计，并非对15岁以下用户实施同等的一刀切禁令。（新浪财经）
  url: https://36kr.com/newsflashes/3984462938061831?f=rss
  source: 36kr.com
