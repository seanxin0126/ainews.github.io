  description: "作者 | 张子怡\n 编辑 | 袁斯来\n 硬氪获悉，宠物智能科技品牌Moonback近日完成数千万元首轮融资，投资机构为AI上市公司。本轮融资将主要用于AI算法、研发和市场团队建设。\n\
