- title: 中方呼吁推动人工智能向上向善、造福人类
  description: 中国常驻联合国代表傅聪23日在安理会“人工智能与国际安全”公开会上发言，呼吁国际社会加强团结合作，坚持发展与安全并重，推动人工智能朝着向上向善、造福人类的方向发展，助力世界和平稳定与发展繁荣。他说，人工智能技术深度嵌入全球产供链和创新网络，各国有权根据实际需要和市场规律，自主选择人工智能技术、产品和服务。要针对人工智能引发的内生和衍生风险，不断完善监管框架、应急响应和跨国协作机制，坚决打击恐怖组织、极端势力和跨国犯罪集团恶用滥用人工智能。人工智能是全人类的共同财富，不应沦为富国和富人的游戏。（央视新闻）
  url: https://36kr.com/newsflashes/3997012689899650?f=rss
  source: 36kr.com
