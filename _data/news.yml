- title: 英国广告巨头WPP在伦敦开设AI广告制作中心
  description: 英国广告巨头WPP周三宣布在伦敦开设了一个AI广告制作中心，这是其全球布局计划中的首个此类设施，旨在满足市场对高质量广告的需求，以便快速在社交媒体及其他平台上进行投放。作为其扭亏为盈计划的一部分，WPP首席执行官辛迪·罗丝（Cindy
    Rose）于今年年初整合了公司的制作能力，组建了“WPP Production”——这是公司旗下的四大业务部门之一。该中心集成了人工智能驱动的制作技术、模块化摄影棚环境以及后期制作能力。（新浪财经）
  url: https://36kr.com/newsflashes/3995339613376646?f=rss
