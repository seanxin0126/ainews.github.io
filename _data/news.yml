- title: 中科曙光与中国－东盟国家人工智能应用合作中心签署战略合作协议
  description: 36氪获悉，9月17日，第23届中国－东盟博览会期间，中科曙光与中国－东盟国家人工智能应用合作中心在广西南宁签署战略合作协议。双方将推进算电协同、算网融合，探索建设大型国产化智算集群并接入国家一体化算力网络，统筹广西及东盟各国算力与数据中心建设运营，同时围绕跨境算力服务拓展跨境通道和国际数据枢纽等基础设施。中科曙光子公司曙光数创已在东盟国家落地多个液冷项目，包括马来西亚某大规模AI智算液冷项目，并通过新加坡总部、马来西亚实验室和青岛工厂形成区域服务体系。
  url: https://36kr.com/newsflashes/3988266923375625?f=rss
