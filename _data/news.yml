- title: 谷歌承认其AI模型在安全测试中侵入三家公司系统
  description: 美国谷歌公司18日承认，其人工智能（AI）模型“双子座”今年5月在网络安全能力测试中，侵入了三家真实公司的系统。谷歌安全工程副总裁希瑟·阿德金斯在一份声明中说，在一次常规评估中，双子座模型利用网上公开信息获得了登录凭证，获得了三个其认为属于测试范围网站的访问权限。谷歌已确保三个相关实体获知此事，并与测试合作方调整测试流程。（新华社）
  url: https://36kr.com/newsflashes/3991069505305353?f=rss
  source: 36kr.com
