- title: World Labs联合创始人李飞飞呼吁对人工智能进行独立监管
  description: 当地时间周二，斯坦福大学教授、World Labs联合创始人李飞飞呼吁由独立和公共部门实体对AI技术进行更多监督，认为对功能日益强大的AI系统进行安全评估不应仅仅由开发这些系统的公司负责。李飞飞表示，虽然AI公司内部的研究人员可以衡量单个模型的效力和安全属性，但这并不能取代政府、行业和学术机构制定的更广泛标准，“我仍然相信独立机构和学术界等公共部门机构制定基准的重要性，以及产业界和政府共同承担责任的重要性。”（财联社）
  url: https://36kr.com/newsflashes/3995283152457862?f=rss
  source: 36kr.com
- title: 香港证监会：将善用包括人工智能在内的先进科技 支持香港金融市场稳健发展
  description: 36氪获悉，香港证监会今日公布支持落实《香港首个五年规划》及2026年《施政报告》的策略行动纲领。香港证监会认为，《香港首个五年规划》及《施政报告》为香港金融市场未来发展提供了清晰方向。作为市场监管机构和市场发展促进者，香港证监会将积极支持特区政府推动金融高质量发展，并与业界携手把政策方向转化为市场成果，提升香港金融市场的深度、广度及国际竞争力。香港证监会行政总裁梁凤仪表示：“随着香港资本市场迈向新的发展阶段，证监会会将加强与业界持份者的沟通和合作，确保市场参与者充分理解监管要求及发展方向。我们亦会深化与内地及海…
  url: https://36kr.com/newsflashes/3995755109912707?f=rss
