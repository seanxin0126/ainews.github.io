- title: OpenAI和Anthropic讨论对对方AI模型进行压力测试
  description: OpenAI和Anthropic讨论了一项具有法律约束力的协议，对对方的AI模型进行压力测试。今年早些时候，两公司及其律师讨论了一项协议，计划对各自的模型进行一系列测试，以寻找漏洞或潜在危险。拟议协议规定，两家公司将获得对方已商业化AI模型的应用程序编程接口（API）访问权限，但不包括尚未发布的模型。OpenAI和Anthropic均保证，在测试过程中不会保留对方的数据，目前尚不清楚双方是否最终敲定了这项协议。（新浪财经）
