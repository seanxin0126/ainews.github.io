- title: 软银将Arm保证金贷款增至250亿美元，加大人工智能押注
  description: 软银集团已将其以芯片子公司Arm股份为担保的保证金贷款增加50亿美元，至250亿美元。该贷款本月已与债权人重新协商并签署，用以支持软银扩大人工智能投资。软银创始人孙正义需要数十亿美元资金，用于其不断增长的人工智能投资，其中包括对OpenAI近650亿美元的承诺。这是软银第三次扩大以Arm股份为抵押的保证金贷款规模。（新浪财经）
