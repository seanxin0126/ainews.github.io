  description: 当地时间9月17日，英国国王查尔斯三世在苏格兰邓弗里斯庄园（Dumfries House）主持召开人工智能峰会。英伟达CEO黄仁勋（Jensen
    Huang）、谷歌DeepMind创始人哈萨比斯（Demis Hassabis），以及OpenAI、Anthropic等全球人工智能（AI）巨头高层及英国政府代表参会，共同讨论AI发展的机遇、风险与治理原则。（第一财经）
