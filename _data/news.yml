- title: 一年卖出数十万台E-bike后，这家公司要做AI移动出行｜36氪首发
  description: "作者 | 张子怡\n 编辑 | 袁斯来\n 硬氪获悉，智能轻出行企业大鱼智行近期完成近亿元Pre-B轮融资，本轮由同鑫资本领投，多家机构跟投。融资资金将主要用于新品研发、智能化技术升级、全球品牌建设及供应链能力提升。\n\
