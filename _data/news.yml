- title: 国家数据局局长刘烈宏主持召开具身智能座谈会
  description: 国家数据局网站9月13日消息，9月10日，国家数据局党组书记、局长刘烈宏主持召开具身智能座谈会。会上，中国科学院自动化研究所、北京通用人工智能研究院、光轮智能、京东集团、深度机智、石景山人形机器人数据训练中心、星海图、自变量、北京人形机器人创新中心等企业代表，围绕“数据赋能具身智能发展”发表意见建议。国家数据局党组成员、副局长夏冰出席会议。当前，具身智能产业蓬勃发展，呈现出数据驱动特征，对高质量、多样化、大规模数据的需求持续增长。国家数据局将坚持问题导向、把握产业发展趋势，加强科学布局和发展引导，适时推动具身智能…
