- title: 科技巨頭實體安全拉警報！OpenAI、Meta 驚傳保全發出罷工通牒，最快週五全面撤哨
  description: '加州保全工會正式向 OpenAI 與 Google 等企業發出通牒，這場罷工預計將使矽谷科技巨頭面臨實體維安真空的重大風險。若勞資談判最終破裂，這波罷工行動將迫使眾多科技巨頭重啟遠距辦...當全球科技產業全力推動人工智慧軍備競賽之際，矽谷巨頭們總部大樓的實體安全防線卻拉起了警報。

