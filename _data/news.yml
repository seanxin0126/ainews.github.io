- title: 中兴通讯参股公司成立科技新公司，经营范围含工业机器人制造等
  description: 36氪获悉，天眼查App显示，近日，联视基石（杭州）科技有限公司成立，法定代表人为许晓苑，注册资本500万元，经营范围包括人工智能基础资源与技术平台、人工智能硬件销售、智能机器人的研发、工业机器人制造、集成电路设计等。股东信息显示，该公司由浙江基石算力科技有限公司全资持股，股权穿透图显示，中兴通讯股份有限公司持有浙江基石算力科技有限公司30%股权。
