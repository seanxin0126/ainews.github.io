- title: 日本半导体材料商投资人工智能硬件基金
  description: 日本半导体材料巨头Resonac（力森诺科）、日东电工（NittoDenko）以及双日株式会社（Sojitz）已正式同意投资美国硅谷风投机构MatterVenturePartners的第二只硬科技基金。该基金专注于芯片和其他人工智能相关硬件的制造商，旨在寻找人工智能领域的合作伙伴。（新浪财经）
