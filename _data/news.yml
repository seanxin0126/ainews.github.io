- title: Anthropic目标估值约2万亿美元
  description: 路透社12日援引消息人士的话报道称，英伟达公司目前正考虑最高出资100亿美元、参与美国人工智能公司Anthropic首次公开募股。这引发了业内对AI产业循环投资的担忧。据悉，Anthropic
    本次IPO最高拟募资1000亿美元，有望超过SpaceX今年6月上市时750亿美元的募资规模。公司目标估值约2万亿美元。如果这一估值得以兑现，Anthropic的估值将超过SpaceX上市时1.77万亿美元的水平，创下全球拟上市企业估值新高。（央视财经）
  url: https://36kr.com/newsflashes/3981965881048064?f=rss
  source: 36kr.com
- title: Anthropic将连续第二个季度实现盈利
  description: Anthropic向投资者表示，预计将实现连续第二个季度盈利。这对于Claude大模型背后的这家AI初创企业而言，是一个重要里程碑。该公司二季度实现创立以来首个季度盈利，营收飙升至115亿美元以上。相关数据是该公司为筹备IPO向投资者推介材料的一部分。Anthropic增长速度超过竞争对手OpenAI，企业API产品与Claude代码开发工具需求旺盛。公司强调算力效率提升是利润率改善的核心驱动因素。这家AI企业同时警示，由于持续重金投入新一代前沿模型与算力基础设施，未来季度盈利无法保证。（新浪财经）
  url: https://36kr.com/newsflashes/3982461988994053?f=rss
  source: 36kr.com
- title: OpenAI、Anthropic 再次发出「AI 末日」警告；小米澎程今日全国交付；Deepseek 灰度测试 AI 语音对话
  description: 'OpenAI 首席执行官：今年不会上市，不能冒哪怕 10% 杀死所有人的风险

    OpenAI 首席执行官 Sam Altman 在接受采访时表示，这家人工智能公司专注于解决围绕 AI 技术的安全担忧，今年不会上市。

    Altman 表示，今年进行首次公开募股「时机不合适」，公司要到明年才会上市。

    「我认为，哪怕冒着 10% 的在本十年结束前杀死所有人的风险，都是不可接受的，」Altman 说，「我认为，我们正在进入一个新时代，就像过去迈入其他时代时一样，我们需要采取不同的行动，确保我们所做的事情能够让这一理念造福全人…'
  url: http://www.geekpark.net/news/370228
  source: Geekpark.net
- title: 新品密集发布，光通信业技术迭代速度超预期
  description: 第二十七届中国国际光电博览会上，多家上市公司及科创企业携年度重磅产品、突破性技术方案集中亮相。从最上游的激光芯片到光引擎、光纤光缆，再到交换系统等环节，围绕AI算力密集刷新技术指标，代际跃迁速度明显加快。谈及投资者对AI增长的担忧，上述业内人士表示，AI投资回报闭环已显现，现在唯一不确定的是哪一条技术路径是最终方案，但目前所有的技术路径都能找到适合的应用场景。（上证报）
