- title: PCB涨价向下游传导顺畅，更多行业应用开始起量
  description: 9月23日，A股PCB（印制电路板）概念股强势领涨，中一科技、集泰股份、澳弘电子、江南新材、依顿电子等多只个股涨停。消息面上，江西省宏瑞兴科技股份有限公司、松下、南亚塑胶等公司近期再度上调覆铜板（CCL）等产品价格。调研产业链获悉，当前PCB产业出现显著变化：一方面，比上游涨价更为值得关注的是，PCB板厂迎来盈利修复窗口；另一方面，产业成长驱动力也在悄然蓄势，除了AI算力动能持续强劲，机器人、光模块等新成长动能已初现端倪，整个产业进入“强者恒强”的发展格局。（上证报）
