- title: 云天励飞：在研芯片进展顺利，和下游市场的对接在同步进行
  description: 9月17日，在半年度业绩会上，云天励飞董事长兼总经理陈宁介绍，今年以来大算力推理芯片开始迎来市场需求的爆发，公司在研芯片进展顺利，和下游市场的对接亦在同步进行。公司的下一代芯片DeepVerse是针对大模型推理应用场景设计的一系列AI推理芯片。基于DeepVerse芯片构建的智能计算产品包括加速卡、AI推理服务器、AI超节点和AI集群，支持各类大模型的高效推理和微调计算。通过系统级软硬件协同优化，这些智能计算产品提供了高效的AI推理计算平台，构建高性价比的AI推理计算基础设施。（证券时报）
