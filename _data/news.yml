- title: 中国信通院政经所发布《全球数字经贸规则年度观察报告》
  description: 36氪获悉，在第五届数字贸易法治论坛上，中国信息通信研究院政策与经济研究所发布了《全球数字经贸规则年度观察报告》。中国信通院政策与经济研究所所长辛勇飞对报告进行了深度解读。报告结合人工智能技术飞速迭代、国际经贸格局深刻调整等新形势，系统分析了数字经贸规则的最新发展态势与焦点议题的最新走向，并对未来趋势作出展望。期待为各界了解数字经贸规则动向、促进交流合作贡献绵薄之力。
