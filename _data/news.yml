- title: “星语智能”完成千万级天使轮融资
  description: 近日，聚焦AI 400热线的星语智能完成千万级天使轮融资。星语通过自研端到端语音模型和跨Agent群组模型工程能力，在极短的实时交互中，同时完成语音处理与深度业务推理，让AI在保持自然响应速度的同时完成业务判断、流程服务和工单闭环。目前已在众多龙头企业规模化运行后完成率可达90%，显著降低人工坐席压力与运营成本，单日AI服务时长超过10万分钟。
