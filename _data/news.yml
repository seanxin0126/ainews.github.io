- title: Anthropic和OpenAI在呼吁放缓开发之后推出成本更低的新模型
  description: Anthropic和OpenAI周二各自宣布推出新的、成本更低的人工智能模型，因为两家前沿实验室继续面临来自更便宜的开放权重竞争对手的激烈竞争。OpenAI为其GPT-6系列引入了更多层级，即GPT-6
    Sol和GPT-6 Luna，与GPT-5.6的促销定价相比，API价格降低了50%。Anthropic周二发布了Claude Opus 5.5，这是新的Claude
    5.5模型系列中的最新发布。该公司将这一最新版本描述为更具token效率的版本，运行成本将比该公司的Opus 5低约40%。（新浪财经）
  url: https://36kr.com/newsflashes/3995185580953728?f=rss
