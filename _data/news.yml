- title: AI计算平台Acrab与维他动力达成战略合作
  description: 36氪获悉，近日，智能体计算平台公司Acrab与具身智能终端公司Vbot维他动力宣布达成战略合作。双方将围绕可插拔Agent Compute架构展开联合研发与生态合作。Agent
    Compute Module（可插拔智能体计算模块）是一个可插拔、模块化的端侧硬件。通过高速接口为机器人补充高性能端侧AI算力，该模块能够提升其大模型推理及Agent实时响应能力，让智能从固定算力升级为按需扩展。
