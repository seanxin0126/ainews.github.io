- title: Anthropic CEO Amodei将向联合国安理会介绍人工智能风险
  description: Anthropic首席执行官达里奥·阿莫代将于周三出席联合国安理会有关人工智能未来的会议，并就人工智能发展及其潜在风险进行远程简报。除Amodei外，OpenAI首席执行官萨姆·奥特曼、联合国人工智能小组联合主席约书亚·本吉奥，以及Hugging
    Face首席执行官克莱门特·德朗格也将参与此次会议。（新浪财经）
