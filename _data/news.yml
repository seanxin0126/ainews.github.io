- title: OpenAI称正与Anthropic和谷歌合作应对AI安全问题
  description: OpenAI正在与主要竞争对手Anthropic和谷歌DeepMind共同研究应对人工智能安全问题的措施。随着越来越多人担忧这项技术可能对经济和安全构成威胁，AI行业正在加大力度作出回应。OpenAI全球政策主管Chris
    Lehane周二表示，该公司与Anthropic和谷歌的相关接触已经进行了数周。他还表示，OpenAI认为，这三家AI公司就安全问题展开协调无需获得反垄断豁免。（新浪财经）
  url: https://36kr.com/newsflashes/3985275038382852?f=rss
  source: 36kr.com
- title: 特朗普反对AI监管，削弱行业呼吁放缓AI发展的诉求
  description: Anthropic、OpenAI 以及其他 AI 企业高管上周末接连发声，警示高级人工智能潜藏风险，呼吁放缓模型开发节奏。而特朗普周一就在社交媒体大量发文，驳斥这一系列诉求。特朗普公开反对出台新的
    AI 监管规则，这给 Anthropic、OpenAI 带来新的难题。两家企业一方面需要保持高速增长，支撑近万亿美元的估值；另一方面又要回应社会越来越强烈的担忧
    ——AI 技术迭代过快，存在脱离人类掌控的风险。（新浪财经）
  url: https://36kr.com/newsflashes/3984633079511808?f=rss
  source: 36kr.com
- title: OpenAI首席执行官Altman“有信心”AI行业能够自行保障安全
  description: OpenAI首席执行官Sam Altman表示，他相信人工智能公司能够安全地开发这项技术，而不会对广大民众造成重大伤害。“我对我们公司——以及整个行业——安全推进这项技术的能力非常有信心，”Altman周二在旧金山举行的Dreamforce大会上与Salesforce
    Inc.首席执行官Marc Benioff对话时表示。（新浪财经）
  url: https://36kr.com/newsflashes/3985272809487106?f=rss
  source: 36kr.com
- title: 三星参与荷兰AI芯片初创公司Euclyd的2亿欧元融资
  description: 三星已向荷兰人工智能芯片制造商Euclyd注资，参与其2.31亿美元的融资轮次，此举正值市场大举投资英伟达图形处理器替代方案的热潮中。这家2024年成立的初创企业正在研发一套AI芯片系统。该系统架构不同于GPU，面向推理场景，涵盖处理器与内存架构。（新浪财经）
  url: https://36kr.com/newsflashes/3983944036072192?f=rss
  source: 36kr.com
- title: 防务初创企业Shield AI洽谈新一轮融资，估值目标至少200亿美元
  description: 据一位了解本轮融资的知情人士透露，研发军用无人机与人工智能软件的初创公司 Shield AI 正在洽谈新一轮融资，目标估值至少200亿美元。如果本轮融资顺利完成，相比仅仅五个月之前，该公司估值将提升约60%。（新浪财经）
  url: https://36kr.com/newsflashes/3984505519569673?f=rss
  source: 36kr.com
- title: 比尔·盖茨呼吁推动人工智能公平，盖茨基金会承诺投入10亿美元
  description: 盖茨基金会计划在未来两年内投入至少10亿美元以提高人工智能的可及性。基金会联合创始人比尔·盖茨警告称，人工智能的普及方式可能会进一步扩大全球贫富鸿沟。盖茨表示，这笔资金将用于为教育、医疗和农业领域从业者开发工具，同时支持将非英语语言资料纳入大型数据集，以满足使用其他语言的开发者需求。盖茨基金会计划在2045年彻底关闭前累计捐出2000亿美元。（财联社）
  url: https://36kr.com/newsflashes/3984417095334657?f=rss
  source: 36kr.com
- title: 特朗普政府官员与Anthropic一位高管会谈，讨论AI安全问题
  description: 特朗普政府高级官员周二与Anthropic PBC一位高管会谈，讨论人工智能（AI）安全风险。知情人士称，Anthropic首席算力官Tom
    Brown与五角大楼首席技术官Emil Michael以及美国商务部长霍华德·卢特尼克进行了视频会谈。Brown近来已成为Anthropic在华盛顿的主要代表人物。Anthropic拒绝置评。白宫未回应置评请求。（新浪财经）
  url: https://36kr.com/newsflashes/3985320254651141?f=rss
  source: 36kr.com
- title: 微软首席执行官纳德拉向员工发布有关人工智能安全的内部警示
  description: 微软首席执行官萨蒂亚·纳德拉（Satya Nadella）在微软内部留言板上发表了一份备忘录，强调人工智能（AI）必须保持在人类控制之下，并对更广泛的第三方安全测试表示支持。这份在周一晚些时候发布的内部备忘录中，纳德拉警告业界，随着AI技术的风险日益增加，企业必须花费足够的时间来确保技术安全。他写道：“当赌注越来越高时，人们应该花费所有需要的时间。否则，你无论如何都会失去运营许可。”此番言论正值科技界对超级智能与AI安全展开激烈辩论之际。（新浪财经）
  url: https://36kr.com/newsflashes/3983953928797184?f=rss
  source: 36kr.com
- title: Anthropic、Salesforce CEO：企业AI应用仍处早期，充分释放价值需更多支持
  description: 当地时间9月15日，Anthropic首席执行官达里奥·阿莫代伊和Salesforce首席执行官马克·贝尼奥夫表示，企业目前对AI工具的应用仍处于早期阶段，AI在经济中的潜在价值尚未得到充分释放。阿莫代伊称，目前AI技术的经济价值仅有约5%至10%得到利用。贝尼奥夫表示，Salesforce目前已有约7000名员工使用集成Anthropic
    Claude模型的企业工具，但不同企业的AI应用程度存在较大差异，公司需要进一步帮助客户加快AI转型。（界面）
  url: https://36kr.com/newsflashes/3985309326130183?f=rss
  source: 36kr.com
- title: Blykalla与微软达成人工智能合作协议
  description: 9月15日，一份声明显示，瑞典核技术公司Blykalla与微软签署协议，将运用人工智能技术解决许可和授权等行业瓶颈问题。（新浪财经）
