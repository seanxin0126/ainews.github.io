- title: 润泽科技：拟出资10亿元参与设立创业投资基金，主要投资于人工智能、具身智能等领域
  description: 36氪获悉，润泽科技公告，公司拟作为有限合伙人以自有资金认缴出资10亿元，参与投资厦门时代深远创业投资基金合伙企业（有限合伙），占合伙企业认缴出资总额的20.4081%。基金总认缴规模49.0001亿元，主要投资于人工智能、具身智能、科技应用、前沿科技等领域。本次投资已经公司总经理办公会议审议通过，无需提交董事会和股东会审议，不构成关联交易及重大资产重组。
