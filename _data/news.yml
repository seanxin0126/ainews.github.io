- title: 华为副董事长汪涛：华为AI战略的核心是算力
  description: 华为副董事长、轮值董事长汪涛17日在上海举行的华为全联接大会上介绍华为面向智能时代的重要部署：一是华为AI战略的核心是算力，坚持硬件变现；二是“超节点+集群”，打造中国坚实算力底座，为世界构建新的选择；三是构建开源开放的算力生态，支持主流大模型原生训练、积极拥抱“百模干态”；四是盘古大模型聚焦华为产品智能化，增强自身产品竞争力；五是提供线下+线上的灵活算力方案，加速行业智能化；六是创新多样性算力，推进AI入端、上车，智能无所不及；七是围绕“用算”构筑新一代通信网络，把智能传递给每个人、家庭和企业。（国是直通车）
  url: https://36kr.com/newsflashes/3986912304478982?f=rss
