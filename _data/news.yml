- title: ENGIE将为甲骨文得州业务供应最高568兆瓦可再生电力
  description: 9月17日，法国能源企业Engie北美公司宣布与甲骨文签署可再生能源供应协议，将通过服务于得州电力可靠性委员会（ERCOT）市场的风电资源，为甲骨文在得州的业务供应最高568兆瓦可再生电力。甲骨文表示，此次合作将支持其AI和云业务扩张，并推进到2035年实现AI数据中心100%用电与无碳电力匹配的目标。（界面）
