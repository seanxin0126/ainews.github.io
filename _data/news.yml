  description: 36氪获悉，据工信微报，工业和信息化部近日印发《“人工智能+软件”专项行动实施方案》。《方案》提出，到2028年，软件和信息技术服务业智能化水平显著提升，培育一批高水平智能编程工具和智能开发平台，推广应用覆盖2万家规模以上软件企业，关键软件智能化升级取得显著成效，累计组织实施100项软件企业智能化技改项目，以智能体软件为代表的软件新形态加速涌现，在重点行业打造100个智能体软件标杆应用，信息技术服务向智能化、价值化跃升，形成一批行业深度应用解决方案和典型场景，开放协同的开源社区建设取得积极进展，孵化5个以上优质开…
