- title: 燧原科技将正式登陆科创板，国产AI芯片四小龙齐聚资本市场
  description: 9月11日，燧原科技将正式登陆科创板，至此，摩尔线程、沐曦股份、壁仞科技、燧原科技四家国产算力芯片企业（又称“AI芯片四小龙”）齐聚资本市场，意味着这四家公司已完成初步的技术验证和资本化，竞争步入新阶段。北京社科院研究员王鹏分析，在国内AI算力供需缺口持续拉大、国产替代的刚性需求背景下，“四小龙”进入营收高速增长阶段，但盈利拐点仍待观察。未来要进行的是系统性比拼：规模化交付能力，支撑大规模智算集群落地；软硬件全栈适配效率，快速完成主流大模型、行业场景的适配调优；以年为单位快速迭代产品；在特定行业、特定算力场景建立…
