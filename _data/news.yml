- title: 阿里巴巴与顺丰达成战略合作
  description: 36氪获悉，据阿里云消息，今日，阿里巴巴与顺丰达成战略合作。双方将结合阿里巴巴在电商生态、云计算及人工智能等方面的技术能力，借助顺丰在智慧物流网络和供应链服务优势，重点围绕电商履约、跨境物流、数智供应链、人工智能应用、智能协同与组织数字化等领域探索合作。
