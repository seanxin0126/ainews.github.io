- title: 贝森特将Hugging Face事件归责OpenAI管理层，称责任在人而非AI
  description: 美国财政部长斯科特·贝森特表示，近期涉及OpenAI先进人工智能模型的黑客事件，责任在于该公司的管理层，但他并未进一步暗示可能会产生什么后果。“关于Hugging
    Face事件，责任在OpenAI管理层，而不是一群智能体，”贝森特周一接受采访时表示。他说，自己赞同麻省理工学院研究实验室联席主席Daniel Huttenlocher的观点，即“应该由人类负责，而不是AI”。（新浪财经）
