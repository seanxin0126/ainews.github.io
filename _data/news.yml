- title: Meta个人智能体引发乐观情绪，人工智能交易卷土重来
  description: 随着Meta Platforms Inc.新推出的个人智能体初显成功迹象，市场对芯片需求的乐观预期重获提振，全球人工智能(AI)股票应声上涨。此前，受放缓AI发展的呼吁所影响，该板块曾面临艰难局面。本轮涨势源于Meta的Muse
    AI智能体在本月初推出后迅速登顶苹果公司免费应用排行榜榜首。油价走低进一步提振了风险偏好。这一走势也为炙手可热的AI交易提供了喘息之机，此前该领域曾因估值过高而承压，近期科技界领军人物又对先进模型带来的生存威胁表示担忧。Muse的早期热度为AI需求依然强劲提供了新的证据，从而缓解了部分担…
