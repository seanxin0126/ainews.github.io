- title: OpenAI与东南亚Grab合作推出人工智能技能培训项目
  description: 周三，OpenAI与总部位于新加坡的出行及外卖平台Grab共同启动项目，面向Grab平台的司机、商户、外卖骑手开展培训，教他们在工作场景使用ChatGPT。该项目覆盖新加坡、泰国、印度尼西亚、菲律宾，计划未来两年培训约3万名从业人员。参与学员可获得为期三个月的ChatGPT
    Plus免费使用权，学习AI实用操作技能。（新浪财经）
