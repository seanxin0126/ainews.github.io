- title: Anthropic据悉考虑在IPO前发布新AI模型
  description: Anthropic正考虑推出一款新的人工智能（AI）模型，以应对OpenAI自发布GPT-6 Astra以来所形成的势头。根据企业支出管理平台Ramp的最新数据，GPT-6
    Astra约占该平台追踪的企业AI支出的13%，Anthropic旗下Claude Fable则约占8%。这引起了一些原本有意投资Anthropic的投资者的担忧。他们表示，正重新评估Anthropic作为企业级AI工具领先提供商的地位。在上市时间表方面，据最新报道，Anthropic可能将IPO推迟至美国11月中期选举结束之后。（财联社）
