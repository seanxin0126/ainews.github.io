- title: 头部智能眼镜品牌完成近10亿C轮融资，已正式启动上市筹备工作｜硬氪首发
  description: "作者｜黄楠\n 编辑｜袁斯来\n 硬氪获悉，全球智能眼镜品牌「影目科技」近日完成C3轮融资，由四川振兴科创基金领投，静安资本、市北高新、广州产投、四川中试、眉山中试及东坡国投跟投。继年初完成C1、C2轮融资后，公司C轮融资累计金额近10亿元。\n\
    \ 本轮资金将主要用于新一代空间智能硬件产品线的研发落地，及INMO AIOS 系统的持续迭代升级，加强硬件与软件底层核心能力构建；同时，加大品牌建设与全渠道布局，完善商业化能力，推动产品破圈，实现业务加速增长。\n\
    \ 目前，影目科技已正式启动上市筹备工作，近年来公司营收增速连续保持…"
