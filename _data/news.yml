- title: 谷歌DeepMind负责人：下一代旗舰模型Gemini 4发布时间或“远早于”今年底
  description: 谷歌DeepMind部门负责人Koray Kavukcuoglu周三表示，谷歌接近发布其最新旗舰模型 Gemini 4，这是这家科技巨头在人工智能模型竞赛中落后于竞争对手Anthropic和OpenAI后期待已久的进展。Kavukcuoglu在一次活动上表示，Gemini
    4正处于被称为“后训练”的开发阶段的初期，在此阶段，基础AI模型将得到完善，以使其表现可靠。他表示，他希望该模型的发布时间会“远早于年底”。（新浪财经）
