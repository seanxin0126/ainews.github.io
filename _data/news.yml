- title: 多国领导人呼吁管控前沿人工智能发展
  description: 芬兰总统府21日发布公告说，芬兰、挪威等多国政府及欧盟机构领导人联合发布国际倡议，呼吁全球加强前沿人工智能治理与国际协作，确保人工智能技术始终处于人类可控范围之内。倡议指出，人工智能是极强大的技术，具有改善民生、推动科学进步和全球经济发展的潜力。但与此同时，前沿人工智能模型的快速发展如果得不到妥善管理，将对安全造成严重风险。（新华社）
