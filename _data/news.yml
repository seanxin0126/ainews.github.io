- title: 韩国大型科技企业LG与微软缔结人工智能合作伙伴关系
  description: 当地时间周一，LG集团会长具光谟在这家美国科技巨头位于华盛顿的总部，与微软首席执行官萨提亚・纳德拉会面，LG旗下主要子公司的高管也一同出席。根据合作协议，随着微软在全球布局AI数据中心，两家企业将携手推进AI数据中心商业化落地。短期内，双方将探讨为微软核心战略数据中心站点供应大容量冷却解决方案。LG电子现已拥有完整的数据中心热管理产品矩阵，包含冷水机组、冷却液分配单元以及空调系统。（新浪财经）
