- title: 蓝思科技：已开展HDD玻璃硬盘客户验证，实现小批量出货
  description: 36氪获悉，蓝思科技在互动平台表示，公司攻克了超精密表面抛光等技术壁垒，已开展HDD玻璃硬盘客户验证，实现小批量出货。具身智能领域，公司与国内外多家头部客户围绕机器人精密零部件加工、关节模组生产、整机组装等智造环节开展深度协同，在机器人头部模组、灵巧手、关节模组等核心零部件及整机组装领域已实现核心卡位，累计出货量位居行业前列。具体客户名称及各客户的供货品类、供货节奏因商业机密不便披露。
