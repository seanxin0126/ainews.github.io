- title: 瑞银：全球AI领域资本支出2027年升至1.4万亿美元，九成增量来自内存涨价
  description: 瑞银目前预计，2026年人工智能资本开支将接近1万亿美元，2027年进一步攀升至约1.4万亿美元，而这一增长背后的最主要原因是内存成本大幅上涨。瑞银估算，内存相关开支将从2025年的710亿美元飙升至今年的3670亿美元，2027年达到9230亿美元。其余AI相关成本预计在2026年为6310亿美元，2027年回落至5250亿美元。这意味着，今年内存成本上涨贡献了约60%的AI资本开支增量；而到2027年，随着其他零部件支出下滑，内存成本增幅甚至将超过AI资本开支的全部净增量。（新浪财经）
  url: https://36kr.com/newsflashes/3991342974204929?f=rss
  source: 36kr.com
