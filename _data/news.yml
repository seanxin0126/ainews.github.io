- title: OpenAI据报正与Anthropic、谷歌DeepMind合作推进AI安全
  description: 当地时间9月15日，据报道，OpenAI正与竞争对手Anthropic及谷歌旗下DeepMind就人工智能安全问题展开合作。OpenAI全球政策负责人克里斯·莱哈恩表示，三家公司已就安全议题沟通数周，并认为三家公司开展相关合作无需获得反垄断豁免。据报道，莱哈恩在华盛顿的一场简报会上表示，与其他AI企业合作并共同优先考虑安全问题更为有利。他还表示，OpenAI支持旨在降低灾难性AI风险的两党立法。（界面）
  url: https://36kr.com/newsflashes/3985323997985799?f=rss
  source: 36kr.com
- title: Meta扎克伯格：保障AI安全应依靠评估人员，而非放缓AI
  description: 元宇宙平台公司首席执行官马克・扎克伯格表示，人工智能实验室应当依靠独立评估人员与顾问，保障模型安全。扎克伯格周二在X平台发文称：“聘请独立评估人员与顾问是行业最佳实践。”
    越来越多科技企业高管正参与这场全球性讨论，探讨如何防止人工智能系统对人类造成伤害，扎克伯格也加入其中。部分企业高管支持放缓人工智能研发节奏，并呼吁各方协作达成共识。扎克伯格写道，Meta自主决定暂缓Muse人工智能工具的研发，并未要求同行先同步放缓研发进度。（新浪财经）
  url: https://36kr.com/newsflashes/3985350490979072?f=rss
  source: 36kr.com
- title: OpenAI披露Hugging Face之外六起模型异常行为案例
  description: OpenAI周三表示，除了近期的Hugging Face事件外，过去六个月中该公司还发现了六起 “意外或令人担忧的模型行为”，并持续呼吁在人工智能模型开发过程中加强安全保护。此次披露之际，人工智能行业正面临越来越大的压力，要求其更加重视模型对齐问题与安全风险。估值近1万亿美元的OpenAI今年早些时候已秘密提交IPO申请，但近期表示可能要等到2027年才会上市。（新浪财经）
  url: https://36kr.com/newsflashes/3986715100347395?f=rss
  source: 36kr.com
- title: 英伟达与Meta高管拒绝协同放缓AI发展的提议
  description: 英伟达的黄仁勋与Meta的马克・扎克伯格，拒绝前沿人工智能实验室以安全为名、协同放缓研发进度的提议。二人认为，相关风险应当由各家企业自行应对。上周末，Anthropic的达里奥・阿莫代伊、OpenAI的萨姆・奥特曼以及埃隆・马斯克公开呼吁行业协同放缓研发节奏，妥善应对AI带来的各类风险。此后，这两位科技企业创始人就此发表了看法。（新浪财经）
  url: https://36kr.com/newsflashes/3985791492848649?f=rss
  source: 36kr.com
- title: AI营销创企“Profound”完成D轮1.8亿美元融资，估值达18亿美元
  description: 36氪获悉，人工智能营销初创公司“Profound”日前宣布，完成D轮1.8亿美元融资，估值达18亿美元。本轮融资由Sequoia Capital和Kleiner
    Perkins共同领投。据了解，Profound成立于2024年，总部位于纽约，迄今已筹集超过3.35亿美元，旨在帮助品牌调整其在线营销策略，以适应越来越多消费者选择通过OpenAI的
    ChatGPT或Google的Gemini等AI聊天机器人发起网络查询，而非使用传统搜索引擎的趋势。
  url: https://36kr.com/newsflashes/3986736353819396?f=rss
  source: 36kr.com
- title: 凯龙高科等在上海成立新公司，注册资本1000万
  description: 36氪获悉，天眼查App显示，近日，凯龙高科技（上海）有限公司成立，法定代表人为臧志成，注册资本1000万人民币，经营范围含智能机器人的研发、智能机器人销售、特殊作业机器人制造、工业机器人制造、工业机器人销售等。股东信息显示，该公司由凯龙高科技股份有限公司、星络讯联（上海）具身智能科技合伙企业（有限合伙）共同持股。
  url: https://36kr.com/newsflashes/3985769656908800?f=rss
  source: 36kr.com
- title: 宇树科技增资至约4亿元
  description: 36氪获悉，天眼查App显示，近日，宇树科技股份有限公司发生工商变更，注册资本由约3.64亿人民币增至约4.04亿人民币，增幅约11%，企业类型由股份有限公司（外商投资、未上市）变更为股份有限公司（外商投资、上市）。该公司成立于2016年8月，法定代表人为王兴兴，经营范围包括智能机器人的研发、智能机器人销售、工业机器人制造等，由王兴兴、上海宇翼企业管理咨询合伙企业（有限合伙）、汉海信息技术（上海）有限公司等共同持股。
  url: https://36kr.com/newsflashes/3985514424744705?f=rss
  source: 36kr.com
- title: 黑石CFO称公司规模使其在人工智能热潮中占据优势
  description: 黑石集团首席财务官Michael Chae表示，公司的投资组合构建和策略使其能够抓住人工智能AI和基础设施领域的增长，并大规模地部署和吸引资本。Chae周二在巴克莱召开的会议上表示，该公司过去一年已为旗下公司完成了九宗首次公开招股（IPO），另有六家“目前在全球各地已提交上市申请”。Chae说，这家管理着1.3万亿美元资产的另类资产管理公司投资于AI、电力、生命科学以及向企业提供私募市场贷款等策略。他说，黑石过去12个月中最大投资中有70%集中在这些领域，“现在是部署的好时机”。（新浪财经）
  url: https://36kr.com/newsflashes/3985382569671681?f=rss
  source: 36kr.com
- title: 恒工精密：拟发行不超8.1亿元可转债用于具身智能机器人等项目
  description: 36氪获悉，恒工精密公告，公司拟向不特定对象发行可转债，募集资金总额不超过8.1亿元，扣除发行费用后用于具身智能机器人本体制造项目、具身智能机器人中试基地及上海研发中心项目、高端装备零部件扩产项目、高端零部件新材料扩产项目及补充流动资金。
