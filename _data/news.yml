- title: OpenAI拟拓展芯片设计等垂直行业，并下调部分模型价格
  description: 当地时间9月7日，OpenAI首席财务官萨拉·弗里亚尔表示，公司正重点拓展芯片设计、生命科学和金融服务等垂直行业，并通过降价应对开源及开放权重模型的竞争。OpenAI还在测试按AI应用实际效果收费的模式，以满足企业对投资回报率的要求。弗里亚尔称，OpenAI自研“Jalapeno”芯片仅用9个月便完成设计并进入流片阶段；公司低价版Luna模型降价80%后，使用量增长约10倍。企业业务收入6月至7月增长32%，高于同期整体年化收入20%的增速；Codex用户已达2500万。（界面）
  url: https://36kr.com/newsflashes/3976008358424833?f=rss
  source: 36kr.com
- title: 韩国选定220亿美元天然气项目，作为该贸易协定下首个投资项目
  description: 韩国已确定将美国得克萨斯州一处燃气发电项目，作为去年达成的一项贸易协议项下的首个对美投资项目。此前数月，双方围绕韩方投资承诺的落实进度产生摩擦，此举或将有助于缓和这对盟友之间的紧张关系。据韩联社及其他韩国媒体报道，该项目位于得州恩西纳尔，投资额约220亿美元，总装机容量6.3吉瓦。项目将先建成1.4吉瓦燃气轮机发电机组，后续再新增4.9吉瓦联合循环发电产能，用于满足人工智能数据中心激增的电力需求。（新浪财经）
  url: https://36kr.com/newsflashes/3975582601916679?f=rss
  source: 36kr.com
- title: 36氪首发丨镭萌科技获千万融资，AI陪伴或许还有另一种可能？
  description: "文丨果脯\n 36氪获悉，2026年9月9日，AI机器人研发公司杭州镭萌科技在Inclusion外滩大会现场，宣布完成千万级天使轮融资。本轮融资由时尚传媒集团与弘颐资管集团联合领投。\n\
    \ 其中，领投方时尚传媒集团成立于1993年，旗下品牌覆盖服装、珠宝等多个领域。本轮投资是他们首次在AI机器人方向布局。9月25日，镭萌旗下AI潮玩bibo将作为“快乐星球专属领航员”参加2026时尚芭莎之夜。届时，双方还将围绕后续设计师合作、限定产品及内容体验展开共创。\n\
