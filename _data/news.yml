- title: 2连板中新赛克：AI应用产品营收占公司整体营收不超过公司上半年营收的2%
  description: 36氪获悉，中新赛克公告，公司股票连续两个交易日收盘价格涨幅偏离值累计超20%，属于股票交易异常波动。针对市场关注的“AI安全概念”的情况，公司AI应用产品以公司AIWorkForce平台为核心，面向政企客户提供AI应用场景开发、智能体部署及AI安全治理等服务。目前该类产品所处市场为新兴市场，尚处于商业化起步阶段。该类产品的营业收入占公司整体营业收入不超过公司2026年上半年营业收入的2%，公司郑重提醒广大投资者理性决策，审慎投资，注意二级市场交易风险。
