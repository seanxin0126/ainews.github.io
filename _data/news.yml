- title: Anthropic披露AI发展指标：Claude主导公司26%研发，参与约90%工作
  description: Anthropic PBC表示，该公司超过四分之一的人工智能研发工作由Claude聊天机器人主导，这为AI能够帮助加快未来模型开发提供了迄今最明确的迹象。根据Anthropic周四发布的报告，Claude“主导”该公司26%的研发，而今年年初这一比例几乎为零。这家AI开发商表示，Claude还参与协助员工约90%的工作。（新浪财经）
