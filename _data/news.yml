- title: Claude 動用 950 個 Agent 掃遍 20 萬條序列，發現全新類 CRISPR 酵素系統
  description: Anthropic 宣布旗下 AI 模型 Claude 在 21 小時內動用 950 個 Agent、處理 2.1 億個 token，在細菌病毒的基因資料庫中發現一種從未被記載的酵素系統，結構與
    CRISPR 相似，命名為 ART（array-associated reverse transcriptases，陣列關聯反轉錄酶）。Anthropic
    表示，這類分析若由人類科學家獨立進行，通常需要數週到數個月。
