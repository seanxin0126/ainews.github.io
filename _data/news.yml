- title: 中信建投：人形机器人板块海内外催化不断，建议聚焦优质环节
  description: 36氪获悉，中信建投研报称，人形机器人板块海内外催化不断，建议聚焦优质环节。宇树登陆科创板，为人形机器人本体公司确定估值锚点，有望带动本体厂商估值重塑。8月26日，第二届世界人形机器人运动会在北京圆满收官。国产链厂商积极推动“大脑”、“小脑”、“本体”等多维度能力建设，积极探索在工业、商业等多场景落地应用，出货量规模持续扩大；随着机器人泛化水平提高，预计其落地场景将进一步扩大。物理AI是人工智能的下一波浪潮，机器人是AI最好的物理载体之一，产业发展趋势明确。后续Optimus
    V3发布及量产进展、国产机器人新品发…
