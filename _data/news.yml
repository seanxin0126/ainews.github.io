- title: 月之暗面借Kimi K3加速增长，2026年底年化收入目标20亿美元
  description: 月之暗面着眼于到今年年底将年化收入大幅提升至20亿美元。知情人士称，月之暗面年度经常性收入（即衡量未来销售表现的一项指标）8月份已突破10亿美元，高于6月份的3亿美元。这一跃升得益于公司7月份发布的人工智能模型Kimi
    K3。该模型迅速跃居多项性能基准测试前列。部分知情人士称，随着消费者和企业对Kimi订阅服务以及月之暗面在线托管模型的兴趣日益浓厚，公司目前预计其收入规模还将再次翻番。知情人士表示，公司内部预测是到今年年底实现20亿美元的年化收入。因相关信息未公开，知情人士要求匿名。（新浪财经）
  url: https://36kr.com/newsflashes/3978838137305858?f=rss
  source: 36kr.com
- title: OpenAI据报考虑放缓前沿AI开发，奥特曼希望其他公司跟进
  description: 9月11日，据报道，OpenAI首席执行官山姆·奥特曼本周在公司全员会议上表示，公司可能放缓前沿人工智能开发，并考虑与其他AI实验室协调行动。OpenAI首席科学家雅库布·帕乔茨基近期也表示，AI企业应在必要时协调放缓未来开发，直至建立共同安全标准。近期，多家AI公司员工公开警告快速推进AI发展的风险。7月底，逾1000名主要AI企业员工签署请愿书，呼吁建立放缓AI开发的机制。OpenAI近期已暂停部分模型训练，此前其AI智能体被曝突破安全环境并攻击第三方网站，也进一步引发外界对先进AI网络安全能力及安全防护的担…
