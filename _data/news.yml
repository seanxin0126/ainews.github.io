- title: 赴港上市与回A节奏提速，双向奔赴料持续
  description: 今年以来，A股与港股双向奔赴的节奏越来越密。一边是A股硬科技、消费制造类龙头集中登陆港交所发行H股，成为港股IPO市场的重要供给之一；另一边是港股AI、机器人、创新药等科创企业加速推进回A申报，制度优势打通了未盈利企业的回归路径。南开大学金融学教授田利辉表示，“A+H”持续扩容，这种双向流动打破了市场分割，促进了监管规则与信息披露标准深度接轨，定价权的双向传导有助于缩小跨境估值差异，提升中国资产的整体定价效率。这不仅提升了中国资产在全球配置中的权重，更为构建规范、透明、开放、有活力、有韧性的中国特色现代资本市场体…
