- title: OpenAI CEO将出席安理会会议，以“务实中间派”立场推动建立AI安全标准
  description: OpenAI联合创始人兼首席执行官Sam Altman将于周三在联合国发表讲话，主张建立全球人工智能（AI）标准，在“是否应放缓AI发展”的这一问题上，将自己定位为务实中间派。此次会议正值纽约联合国大会一年一度的一般性辩论。今年的一项重要议题是对AI失控的担忧，本月早些时候Anthropic一名研究人员因相关担忧辞职，也进一步加剧了这种讨论。（新浪财经）
  url: https://36kr.com/newsflashes/3995923232657289?f=rss
  source: 36kr.com
- title: Anthropic首席执行官：由于安全的缘故 公司将放慢AI的研发进度
  description: Anthropic首席执行官达里奥·阿莫迪在联合国安理会就人工智能议题发言称，人工智能的快速发展推动了健康科学领域的进步。人工智能可能对全人类构成风险。认为存在不法分子利用人工智能制造生物武器的风险。如果管理不善，确实认为人工智能可能会对全人类构成生存风险。由于安全的缘故，公司将放慢AI的研发进度。（财联社）
  url: https://36kr.com/newsflashes/3996599114616961?f=rss
  source: 36kr.com
- title: 奇安信旗下北京人工智能科技公司增资至1亿，增幅约74%
  description: 36氪获悉，天眼查App显示，近日，奇安信人工智能科技（北京）有限公司发生工商变更，注册资本由约5744.04万元人民币增至1亿元人民币，增幅约74%。该公司成立于2010年6月，法定代表人为齐向东，经营范围包括软件开发、软件销售、计算机软硬件及辅助设备零售等，由奇安信科技集团股份有限公司全资持股。
