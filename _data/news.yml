- title: 工信部等九部门：加快汽车人工智能应用中试基地建设
  description: 36氪获悉，工信部等九部门关于印发《智能网联新能源汽车产业发展“十五五”规划》。规划提出，加强人工智能基础能力建设。推动人工智能模型、智能体等技术创新，并率先在汽车行业落地应用。加快汽车人工智能应用中试基地建设，促进行业企业通过公有自有相结合的方式建设智算设施。鼓励企业开放更多应用场景，推动构建人工智能技术全面应用新生态。
