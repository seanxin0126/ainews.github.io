- title: 超衍智能发布自动化AI研究系统首批评估成果，刷新三项SOTA记录
  description: 36氪获悉，近日，超衍智能（Apex Intelligence）发布其自动化AI研究系统的首次评估结果：AI全程自主完成发现改进点、实验验证、从证据中学习、强化下一轮循环的科研闭环，刷新三项基准测试的SOTA纪录，并在多项正面对比中超越斯坦福、NVIDIA、Recursive等机构的自动化系统。超衍智能成立于2026年7月，由清华人工智能学院助理教授陈勇超创办，专注做自主进化基础模型。
