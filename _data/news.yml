- title: 国内首个团队智能体“豆包工作伙伴”发布
  description: 36氪获悉，9月15日，飞书推出8.0版，全面向Agent开放数据与工具能力。飞书8.0对Agent的适配主要体现在三个方面：让人与Agent自然协作、Agent和人一样使用各类产品、企业管理Agent像管人一样权限清晰、安全可控。同时，会上发布了全新产品“豆包工作伙伴”。这是国内首个团队智能体产品，将AI的服务对象从个人扩展到整个团队。目前，豆包工作伙伴处于与企业定向共创阶段，将逐步向客户开放。
  url: https://36kr.com/newsflashes/3984136379054848?f=rss
  source: 36kr.com
- title: 灵心巧手、千味央厨等8000万成立科技公司，含多项机器人相关业务
  description: 36氪获悉，天眼查App显示，近日，郑州千巧科技有限公司成立，法定代表人为孙剑，注册资本8000万元，经营范围含智能机器人的研发、工业机器人制造及销售、工业机器人安装维修、服务消费机器人制造及销售、特殊作业机器人制造、人工智能应用软件开发、人工智能行业应用系统集成服务等。股东信息显示，该公司股东包括北京博佳私募基金管理有限公司、灵心巧手（北京）科技股份有限公司、郑州千味央厨食品股份有限公司。
