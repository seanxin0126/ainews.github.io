- title: 软银为支持OpenAI融资获得118.7亿美元贷款
  description: 9月14日，据报道，知情人士透露，软银集团已获得一笔118.7亿美元的贷款，用于支持其对美国人工智能公司OpenAI的投资，这一金额高于此前100亿美元的目标。知情人士称，这家日本综合企业上周敲定了这笔为期两年的贷款协议，吸引了约20家银行的承诺。（界面）
  url: https://36kr.com/newsflashes/3982603412175875?f=rss
  source: 36kr.com
- title: OpenAI称正就在澳大利亚开展大模型训练进行磋商
  description: OpenAI高管表示，公司正在与澳大利亚方面谈判，探讨在当地训练人工智能大模型的可能性。此举标志这家美国AI企业考虑将部分前沿模型训练工作转移至亚太地区。OpenAI一位负责人透露，相关谈判仍处于磋商阶段，尚未敲定任何最终协议。谈判的核心议题包括算力供给、电力保障、版权法规与监管要求。（新浪财经）
  url: https://36kr.com/newsflashes/3982886463879944?f=rss
  source: 36kr.com
- title: Anthropic对人工智能的警告被视为芯片股的暂时性挫折
  description: 市场策略师称，AI企业高管呼吁放缓相关技术研发，短期内或将对芯片厂商及供应链个股形成压制；但算力基础设施投入依旧保持强劲，长期影响大概率有限。周一早盘，韩国存储芯片厂商三星电子股价一度下跌4.1%，同业SK海力士大跌5.8%，投资者正在评估，前沿模型转向更审慎的研发策略是否会压缩企业盈利。日本市场上，芯片设备企业爱德万测试下跌4.7%，存储芯片厂商铠侠控股大跌9.3%。（新浪财经）
  url: https://36kr.com/newsflashes/3982557256956930?f=rss
  source: 36kr.com
- title: OpenAI总裁布罗克曼：AI“减速”应聚焦前沿模型
  description: OpenAI总裁兼联合创始人格雷格·布罗克曼在播客中表示，如果放缓人工智能发展步伐，范围应主要限于开发最强大模型的前沿AI企业，而不应影响开源模型及个人业余项目。他说，所谓“控制发展速度”，主要针对需要数千亿美元资本投入的大型超级计算机。布罗克曼还表示，OpenAI在近期Hugging
    Face遭黑客攻击事件后已放缓AI模型训练频率，并大幅调整内部安全流程。他同时主张通过全球协调和国际条约管理AI长期发展，认为AI未来可能超越个人、企业乃至单个国家的范畴。（界面）
  url: https://36kr.com/newsflashes/3983045719489545?f=rss
  source: 36kr.com
- title: 英伟达、Palantir等据报限制使用OpenAI和Anthropic最先进AI模型
  description: 9月14日，据报道，英伟达、Palantir和Booz Allen Hamilton正要求OpenAI、Anthropic提供新的安全保障，并减少或停止使用两家公司最先进的AI模型。据报道，Palantir已说服Anthropic承诺对所有模型提供“不可撤销”的零数据保留（ZDR）保障。部分企业正转向使用自研AI模型处理更敏感的业务任务。（界面）
  url: https://36kr.com/newsflashes/3983859207043843?f=rss
  source: 36kr.com
- title: 富士康、阿尔特等在北京成立智能机器人科技公司，注册资本5000万
  description: 36氪获悉，天眼查App显示，近日，北京富特康智能机器人科技有限公司成立，法定代表人为宣奇武，注册资本5000万人民币，经营范围包括智能机器人销售、工业机器人销售、特殊作业机器人制造等。股东信息显示，该公司由阿尔特汽车技术股份有限公司、富士康科技集团有限公司、北京共鑫同达科技合伙企业（有限合伙）共同持股。
  url: https://36kr.com/newsflashes/3982739546323713?f=rss
  source: 36kr.com
- title: 上海：加强科技金融风险识别，深化人工智能、大模型在科技金融风控领域的应用
  description: 36氪获悉，上海金融监管局发布关于推进上海银行业保险业科技金融提质增效的意见，其中提到，加强科技金融风险识别。深入研究技术生命周期发展规律和企业生命周期的风险特征，建立差异化的经营策略和管理要求。加强金融科技在企业准入、审核审批、风险识别等关键控制环节的应用，支持金融机构间共享风控数据，深化人工智能、大模型在科技金融风控领域的应用，对科技型企业开展全景式评价，强化风险识别能力。
  url: https://36kr.com/newsflashes/3982859060280066?f=rss
  source: 36kr.com
- title: Anthropic面向财务顾问推出Claude产品，深化金融业布局
  description: Anthropic PBC正在向财务顾问推介一款Claude，该版本将这款聊天机器人与贝莱德、领航集团等公司运营的金融分析和风险管理技术相结合。Anthropic和贝莱德的高管表示，这套名为Claude
    for Financial Advisors的系统有望加快研究、行政以及投资组合监控任务。这是这家人工智能公司迄今向金融行业扩张的最重要举措之一。（新浪财经）
  url: https://36kr.com/newsflashes/3983860837071616?f=rss
  source: 36kr.com
- title: Space42与Viasat达成10亿美元网络连接增强平台协议
  description: 当地时间9月13日，据报道，一份声明显示，人工智能航天科技公司Space42与美国卫讯公司（Viasat）签署协议，将共同建立平台“Equatys”。该平台将整合太空与地面基础设施，支持在地面网络无法覆盖的地区扩展移动覆盖和叠加网络。Space42和Viasat将各自承诺初始股权投资4亿美元，预计Space42将在未来向第三方投资者开放的股权融资轮中追加投资2亿美元。Viasat预计将被任命为Equatys的主要技术承包商。（界面）
  url: https://36kr.com/newsflashes/3982506424040200?f=rss
  source: 36kr.com
- title: 微软为未来AI模型设限，将听取外部意见后更新规则
  description: 9月14日，据报道，微软发布临时版AI模型行为准则，对未来自研模型设定限制，包括不得协助制造武器、获取危险物质，不得鼓励不健康饮食或生成暴力、露骨性内容；模型还应遵循用户目标，不得形成自身目标或掩盖不当行为。微软AI负责人穆斯塔法·苏莱曼表示，公司将在更新���则前听取外部意见，新版规则将指导2027年起的模型开发。此举正值Anthropic和OpenAI等AI企业高管呼吁放缓前沿模型发展速度之际。（界面）
  url: https://36kr.com/newsflashes/3983862744398595?f=rss
  source: 36kr.com
- title: 英国国王本周将会见英伟达、OpenAI等AI企业高管，探讨如何运用AI
  description: 英国国王查尔斯三世本周将在苏格兰会见各大人工智能企业高管。白金汉宫发布声明称，国王将召集英伟达、谷歌、DeepMind、OpenAI、Anthropic等企业负责人，以及政府官员等参会，“探讨如何以造福社会的方式开发和部署人工智能”。会议地点设在苏格兰西南部艾尔郡的邓弗里斯庄园。（新浪财经）
  url: https://36kr.com/newsflashes/3983078848691205?f=rss
  source: 36kr.com
- title: 词元需求量爆发式增长，4只概念股年内涨幅翻倍
  description: 近日，中国电信研究院发布的《智能体时代AI基础设施发展研究报告(2026)》显示，随着人工智能（AI）产业发展重心从大模型和算力竞争转向智能体规模落地、应用变现，我国词元需求量呈现爆发式增长。一场围绕“词元经济”的地方竞速已悄然拉开帷幕。A股市场亦有部分上市公司布局词元经济产业。从股价表现来看，据统计，截至9月11日收盘，今年以来股价上涨的词元经济概念股有11只，其中行云科技、宏景科技、香江控股、协创数据累计涨幅翻倍。（证券时报）
  url: https://36kr.com/newsflashes/3982799779789570?f=rss
  source: 36kr.com
- title: “讯兔科技”完成超3亿元B轮融资
  description: 36氪获悉，中国金融AI企业“讯兔科技”宣布完成超3亿元人民币B轮融资。至此，公司在过去一年内已完成三轮融资。中保投资、广发信德共同参与；同时获得启明创投、琥珀资本、嘉程资本、信宸资本、钟鼎资本等创投机构和老股东支持，华兴资本继续担任独家财务顾问。本轮融资后，讯兔科技将继续加大模型与产品的技术投入，在深耕本土市场的同时稳步推进海外布局。
  url: https://36kr.com/newsflashes/3983106152840193?f=rss
  source: 36kr.com
