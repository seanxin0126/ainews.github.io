- title: SK集团会长崔泰源呼吁努力构建AI可持续商业模式
  description: 据报道，SK集团会长崔泰源在周五举行的“2026蔚山论坛”上呼吁努力构建人工智能（AI）的可持续商业模式，他表示，对该技术的大规模投资最终必须产生回报，以维持投资和增长。“既然人类已向人工智能投入了如此多的精力和资源，我们就需要建立更好的商业模式来实现其商业化，”崔泰源表示，“人工智能需要创造利润，并最终形成能够自我维持投资的结构。”其还警告称，如果涌入该领域的大量资本和资源未能产生足够回报，可能会出现AI投资泡沫。他强调有必要建立一个自我维持的生态系统，使人工智能相关的利润能够为进一步的投资提供资金。（财联社）
  url: https://36kr.com/newsflashes/3981351698250498?f=rss
  source: 36kr.com
- title: 奥尔特曼：受人工智能安全担忧影响，OpenAI不会在2026年上市
  description: 当地时间9月12日，据报道，OpenAI首席执行官山姆·奥尔特曼在采访中表示，鉴于对人工智能的安全担忧，OpenAI不会在2026年上市。其称：“实际上，考虑到目前围绕安全问题发生的一切，我认为现在上市并非明智之举，而且我们对此并不感到压力。”（界面）
