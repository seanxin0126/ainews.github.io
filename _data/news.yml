- title: 英国议会将邀Meta、谷歌、OpenAI和Anthropic讨论AI安全
  description: 9月22日，英国议会商业、创新、科学与贸易委员会宣布，已向Meta、谷歌、OpenAI和Anthropic发出邀请，要求四家公司参加10月13日举行的AI安全问题听证会。委员会将询问AI企业是否应被强制进行发布前安全测试、是否应强制报告重大安全事故，以及如何防止企业和国家间的竞争导致AI安全标准下降。英国政府人工智能安全研究所也获邀参加。（界面）
  url: https://36kr.com/newsflashes/3994317549271809?f=rss
