- title: 大模型，开始集体变小
  description: "文 | 李炤锋 王欣逸\n 编辑 | 张雨忻\n  \n 在深圳，林舟所在的AI创业公司只有十个人，大部分工作都靠 AI 来完成——每天数百个Agent（智能体）同时运行，它们分头写代码、做研究。\n\
    \ 而驱动这些Agent的，一直都是OpenAI的GPT系列模型。\n 但随着团队交给Agent的任务越来越多，林舟发现GPT跟不上了——他们当时使用的GPT5.6，一次只能同时处理两三个任务。“GPT能处理的并发任务有限，会耽误我们的工作进度。”林舟说，团队开始寻找能让更多任务同时运行、调用价格也更低的模型。\n\
