- title: OpenAI敦促美国牵头为人工智能制定全球标准
  description: OpenAI敦促美国牵头与其他国家共同为前沿人工智能（AI）制定标准，以回应对AI潜在危害日益加剧的担忧。OpenAI周一在博客文章中表示，为了安全地发展人工智能，有必要制定国际技术标准，特别是帮助界定涉及AI模型的哪些类事件应当通报，明确各国如何开展AI发展合作，以及改善开发此类技术所需算力的获取。“要让AI的持续进步安全有益，既需要推进对齐研究，也需要制定共同标准，为各实验室和各国的AI开发提供指引，”OpenAI表示。（新浪财经）
  url: https://36kr.com/newsflashes/3993781620898823?f=rss
  source: 36kr.com
