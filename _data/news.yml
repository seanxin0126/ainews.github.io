- title: 现代汽车将于2029年推出自研驾驶辅助系统
  description: 9月13日消息，现代汽车集团称其正在开发以Atria AI为核心的自研自动驾驶技术。Atria AI是一种端到端人工智能模型，旨在感知周围环境并做出驾驶决策。现代汽车表示，搭载Atria
    AI的Level 2++车辆量产目标定于2029年下半年。与此同时，该集团计划利用真实道路驾驶数据持续训练和改进其Atria AI，并逐步将该技术推广至量产车辆，长期目标是向Level
    4自动驾驶迈进。此外，现代汽车正与美国芯片制造商英伟达合作，以加速高级驾驶辅助和自动驾驶系统的商业化部署。现代汽车表示，计划于2028年上半年在…
