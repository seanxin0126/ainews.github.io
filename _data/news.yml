- title: Meta发布新一代AI眼镜，引入Muse助手
  description: 当地时间9月23日，Meta宣布扩大AI眼镜产品线，推出首款音频眼镜Ray-Ban Meta Audio及Ray-Ban Meta（第三代），并将个人AI智能体Muse引入AI眼镜。Meta还推出与LISA合作的Meta
    Glasses系列等新品，并将产品拓展至新市场。公司称，到今年年底，Ray-Ban、Oakley和Meta Glasses旗下将提供超过100种眼镜选择。（界面）
