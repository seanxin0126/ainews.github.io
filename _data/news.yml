- title: 报道：谷歌、OpenAI和Anthropic拟组建前沿AI标准机构
  description: The Information援引知情人士报道，谷歌、OpenAI和Anthropic正在推进一项成立人工智能（AI）安全标准机构的计划，该机构将不受政府监督。目标是在今年底前或2027年初启动。暂定计划是将这一自律组织命名为“前沿AI标准机构”（Standards
    Authority for Frontier AI）。工作组成员已接洽数位“知名”人士担任首席执行官。接洽对象包括前风险投资人、曾任特朗普政府AI政策顾问的Sriram
    Krishnan。还考虑过拜登政府前官员Arati Prabhakar。（新浪财…
  url: https://36kr.com/newsflashes/3998168560521345?f=rss
  source: 36kr.com
- title: OpenAI、Anthropic被要求在完成白宫测试前不能向英国分享新模型
  description: 据知情人士和一位获准匿名描述该请求的美国政府高级官员透露，白宫已要求 OpenAI 和 Anthropic 在美国政府完成测试之前，不要与英国政府的测试机构分享其最新的人工智能模型。这项来自美国国家网络总监办公室的请求，使相关企业陷入了两难境地：他们要么拒绝向英国人工智能安全研究所提供模型——该机构是全球资源最丰富的政府测试机构之一，此前曾享有优先获取新模型的特权；要么就得冒着惹恼特朗普政府白宫的风险。（新浪财经）
  url: https://36kr.com/newsflashes/3998199026274437?f=rss
  source: 36kr.com
- title: OpenAI智能体在搜集数据期间，又尝试入侵另外四家网站
  description: 今年早些时候，OpenAI的人工智能智能体在执行常规线上数据采集任务时，为获取信息采取了极端手段。非营利人工智能研究实验室Transluce以及澳大利亚政府最新公布的调查结果显示，关联OpenAI的AI智能体曾在5月、6月试图入侵多所大学及政府网站来获取信息。这类入侵尝试，是AI智能体为达成目标而脱离预设指令的又一系列事件。但这一次，入侵尝试并非OpenAI开展网络安全测评（即专门令模型执行黑客攻击任务），而是看起来属于内部基准测试——测试模型在互联网上查找公开信息的能力。（新浪财经）
  url: https://36kr.com/newsflashes/3998121150025865?f=rss
  source: 36kr.com
- title: AI芯片初创企业DensityAI正进入融资谈判后期，投后估值接近100亿美元
  description: 据媒体报道，AI芯片初创企业DensityAI由特斯拉Dojo超级计算机项目的前核心团队于一年前创立，目前正进入融资谈判后期，计划募资数亿美元，本轮融资对应的公司估值将达到100亿美元。知情人士称，公司管理层向潜在投资者表示，已经拿到一份协议：如果DensityAI芯片达到指定性能指标，亚马逊云科技（AWS）将采购其芯片。
    其中一名知情人士称，安德里森·霍罗威茨（a16z）正在洽谈领投本轮融资。（财联社）
  url: https://36kr.com/newsflashes/3998246029070468?f=rss
  source: 36kr.com
- title: 日本监管机构正加强对人工智能数据中心融资的审查力度
  description: 随着日本大型银行和人寿保险公司增加对这一快速扩张领域的风险敞口，日本金融厅（FSA）正加强对相关AI数据中心融资的审查力度。据一位要求匿名的金融厅高级官员透露，监管机构将重点审查贷款机构的风险管理框架等关键环节。该官员表示，目前主要关注的是位于美国的数据中心项目。（新浪财经）
  url: https://36kr.com/newsflashes/3998605168529284?f=rss
  source: 36kr.com
- title: 黃仁勳談 AI 安全：若實驗無法控制，就應該關閉 AI 實驗室
  description: AI 發展速度持續加快，AI 模型自主執行任務所帶來的安全風險也受到關注。輝達（NVIDIA）執行長黃仁勳近日接受《紐約時報》主持人
    Ezra Klein 訪問時表示，如果 AI 實驗室無法控制模型、確保實驗不會失控並造成危害，就應該關閉實驗室。他也強調，AI 公司應對產品安全承擔責任，而不是以產業...
  url: https://technews.tw/2026/09/25/nvidia-ceo-jensen-huang-talk-about-ai-lab/
  source: Technews.tw
- title: IMF：2026年全球AI投资规模或突破2万亿美元，成为增长重要驱动力
  description: 国际货币基金组织（IMF）近日发布年报表示，人工智能可能成为推动全球生产率和投资增长的重要力量，但同时可能加剧劳动力市场压力并带来金融风险。IMF称，2025年AI相关投资预计为美国GDP增长贡献约0.5个百分点，2026年全球私营部门AI投资规模可能超过2万亿美元。IMF指出，AI技能劳动者收入正在提高，但部分中等技能岗位面临自动化替代风险。与此同时，高额AI投资若回报不及预期，可能引发股市估值调整、财富损失和裁员。此外，AI产业链中企业之间的交叉投资和融资关系可能放大风险传导。（界面）
  url: https://36kr.com/newsflashes/3998607176274049?f=rss
  source: 36kr.com
- title: 马斯克：若保持强劲加速度，SpaceXAI约6个月后就能领跑
  description: 马斯克对网友表示，“我持谨慎乐观态度，SpaceX将在两到三个月内推出达到Fable/GPT‑6水准的模型。”有网友对此表示怀疑，回复称“SpaceXAI大势已去。两到三个月后，Anthropic和OpenAI将会拿出性能更出色的产品。”马斯克对此回应称：“我们会持续加速。我们的AI研发才进行了3年，而Anthropic和OpenAI已经做了6到10年。如果我们的加速度（二阶导数）保持强劲，SpaceX大约6个月后就能占据领跑位置。”（新浪财经）
  url: https://36kr.com/newsflashes/3998171956154245?f=rss
  source: 36kr.com
- title: GPT-6 Astra 首次完成 DrivingBench 全程，灣區停車場自動駕駛 134.7 公尺耗費 660 萬 token
  description: OpenAI 的 GPT-6 Astra 成為 DrivingBench 史上第一個完成全程的 AI 模型，在加州灣區停車場駕駛 2022
    年款 Toyota Corolla 行駛 134.7 公尺，耗時 5 分 22 秒、平均時速約 1.5 公里，消耗 660 萬個 token，費用 7.74
    美元。Fable 5.1 完成率約 45%，Grok 4.6 約 11%，GPT-5.6 Sol 約 6%。
