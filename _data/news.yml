- title: 优必选超级智慧工厂投产
  description: 9月12日，优必选工业人形机器人超级智慧工厂投产仪式在广西柳州举行。该超级智慧工厂是优必选打造的全球首个适配万台级产能的工业人形机器人智能制造标杆工厂，占地面积1.4万平方米，主要生产工业人形机器人Walker
    S系列和具身智能工业人形机器人Cruzr系列。据介绍，这里每10分钟可下线1台工业人形机器人，年规划产能超万台。（柳州晚报）
