  description: "作者 | 乔钰杰\n 编辑 | 袁斯来\n \n 本文约2500字，建议阅读5分钟\r\n\n \n 硬氪获悉，高安全等级飞控与显示系统供应商深圳市庆为航空科技有限公司（简称“庆为航空”）近日完成超5000万元新一轮融资，由中信建投资本、光谷科创投、江西金控资本联合投资。\n\
