- title: 聚焦AI全产业链，第五届全球数字贸易博览会今日开展
  description: 第五届全球数字贸易博览会在浙江杭州开展，今年的主题为“在数贸会遇见AI未来”，全方位展示数字贸易领域里的新技术、新场景以及新趋势。本届数贸会以“人工智能赋能数字贸易”为主线，吸引了全球超2000家企业参展，其中人工智能相关企业约占一半。主题展馆还首次设置AI未来展区，一站式展示算力底座、模型服务、场景应用等AI全产业链环节。本届数贸会还将举办数贸创投日等重点活动50场，发布一系列全球数字贸易发展成果。此外，今年的全球数字贸易创新大赛首次以具身智能为主题，百余支队伍将在展会现场展开同台竞技。（央视新闻）
  url: https://36kr.com/newsflashes/3995298690666369?f=rss
  source: 36kr.com
- title: 三菱重工：美国AI数据中心需求推动燃气轮机订单创新高
  description: 三菱重工美国公司董事长兼CEO Takao Tsukui表示，受美国人工智能数据中心建设需求推动，从2026年1至6月的订单进度看，全球燃气轮机需求预计与2025年持平或更高，全年有望再次超过100吉瓦。他预计，这一强劲需求将延续至2027年。（新浪财经）
