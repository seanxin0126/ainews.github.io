- title: 大鳴大放｜河套香港園區首批地五公司入標包括晶片　蔡傑銘：參考沙嶺和洪水橋片區中標價（羅泳思報道）
  description: 【Now新聞台】港深創新及科技園主席蔡傑銘接受本台訪問，透露首批河套香港園區的入標公司有五間，包括晶片和人工智能等企業，評標時會參考沙嶺和洪水橋片區的中標價。
