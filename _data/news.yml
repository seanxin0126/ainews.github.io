- title: 11个新职业23个新工种发布
  description: 人力资源社会保障部等部门9月9日向社会发布船舶岸基管理工程技术人员、具身智能机器人应用技术员、运动数据分析师等11个新职业，社区工作者、低空物流员、适老化改造设计师等23个新工种，调整变更农产品经纪人等6个职业（工种）信息。此次发布的新职业包含5个数字职业、3个绿色职业。至此，我国发布的数字职业、绿色职业分别达到113个、142个。（新华社）
  url: https://36kr.com/newsflashes/3975539747484168?f=rss
