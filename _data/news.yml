- title: OpenAI首席财务官安抚市场：并不担忧前沿人工智能发展速度会放缓
  description: OpenAI的首席财务官Sarah Friar最新表示，她并不担心前沿人工智能的发展速度会放缓。即使现在他们停止发展，世界其他地方的人工智能发展也不会停下。她还强调，即使技术发展必须放慢速度，OpenAI也会根据强劲的投资回报率来决定下一步行动。Friar表示，她并不担心人工智能代理会使用大规模杀伤性武器进行杀戮，但她也表示，我们确实需要认真对待安全问题。
  url: https://36kr.com/newsflashes/3985636623317765?f=rss
  source: 36kr.com
- title: 紫金矿业：全资子公司拟10亿元参投基金，投资人工智能、具身智能等领域
  description: 36氪获悉，紫金矿业9月16日公告，公司全资子公司紫金厦门股权拟作为有限合伙人，认缴出资10亿元参与投资厦门时代深远创业投资基金，持有20.4081%认缴比例。基金总认缴出资额49亿元，主要投资人工智能、具身智能、科技应用、前沿科技等领域。
  url: https://36kr.com/newsflashes/3986251162221568?f=rss
