- title: Anthropic研究员因担忧AI“失控” 离职
  description: 一名 Anthropic 公司研究员出于担忧，选择离开人工智能行业。他认为该实验室及其竞争对手正竞相研发人类无法掌控的AI系统，这也表明头部AI企业内部的安全顾虑正不断加剧。专门通过海量数据训练新型AI模型的研究员雅各布・考克森于周二表示，他将离开这家公司，原因是不想参与全行业争相研发可自我迭代AI系统的竞赛。他担心这类系统可能彻底失控并毁灭人类。（新浪财经）
  url: https://36kr.com/newsflashes/3975480000164352?f=rss
  source: 36kr.com
- title: 三星入股帕西尼？CEO许晋诚回应万亿巨头股东传闻
  description: 9月7日，在帕西尼媒体开放日上，21世纪经济报道记者就“新进股东是否为三星电子”的传闻提问。帕西尼CEO许晋诚回应称，今年8月公司确实新增一家全球消费电子半导体万亿巨头股东，但未透露具体名单，仅表示国际上此类公司并不多。谈及与手机产业链的合作空间，许晋诚透露，帕西尼已与富士康开展产线数据采集相关合作，手机产线需求体量更大。他指出，手机制造自动化率已偏高，但末端检验、封装包装等环节仍偏人工，随着人形机器人与智能技术的完善，手机及消费电子产线90%以上环节均可实现自动化。（21财经）
  url: https://36kr.com/newsflashes/3975632099897605?f=rss
  source: 36kr.com
