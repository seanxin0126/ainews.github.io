- title: Anthropic、OpenAI与谷歌商讨合作建立AI行业标准机构
  description: 当地时间9月13日，据报道，知情人士表示，Anthropic、OpenAI和谷歌一直在就合作建立人工智能行业标准机构进行磋商。报道称，在Anthropic首席执行官Dario
    Amodei周六呼吁人工智能公司在技术测试和审核方面进行协调之前，相关磋商就已经开始。此外，报道称，OpenAI首席执行官Sam Altman在一次员工大会上表示，他支持成立一个面向人工智能行业的测试和审核机构。同时他认为，在没有美国政府支持的情况下，主要人工智能实验室必须自行成立一个标准机构。（界面）
  url: https://36kr.com/newsflashes/3982454507600904?f=rss
  source: 36kr.com
