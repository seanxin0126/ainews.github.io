- title: 北京：打造下一代新型智能终端，推动8K超高清、裸眼3D等技术规模化应用
  description: 36氪获悉，北京市人民政府印发《北京市“十五五”时期高精尖产业发展规划》。其中提到，加快平台企业深化大模型应用，培育新型平台主体。打造下一代新型智能终端，推动8K超高清、裸眼3D、光场显示等技术规模化应用。大力发展数字内容产业，推动游戏产业精品化、国际化，做强电竞产业生态,推进虚拟现实等沉浸式新技术应用。建立人工智能时代网络自主安全防护技术体系，持续优化信创产业发展生态,提高网络安全和信创产品竞争力。
