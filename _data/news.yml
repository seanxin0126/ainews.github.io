- title: 声智科技荣获第二十六届中国专利奖优秀奖
  description: 近日，国家知识产权局正式公布第二十六届中国专利奖授奖名单。北京声智科技有限公司凭借专利ZL202311321072.1《基于预训练语言模型的任务处理方法、装置、设备及介质》，荣获第二十六届中国专利奖优秀奖。据了解，中国专利奖是我国知识产权领域的重要国家级奖项，是对企业自主创新能力、专利技术水平及产业化价值的综合认可。目前，声智正持续推进Physical
    AI模型技术体系建设。推动人工智能从数字世界走向物理世界。
