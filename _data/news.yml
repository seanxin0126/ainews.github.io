- title: 北京：实施“人工智能+”行动，加快推进制造业数字化转型
  description: 9月23日，北京市委常委会召开会议。会议指出，要以科技创新驱动制造业发展，加强原始创新和关键核心技术攻关，促进创新成果高效转化。实施“人工智能+”行动，加快推进制造业数字化转型。要促进先进制造业和现代服务业融合，积极发展服务型制造，支持企业拓展柔性化定制、产品服务等新业态新模式，加快绿色技术装备创新和应用，推动制造业重点领域节能、降碳、减污。要支持制造业领军企业发挥“链主”作用，挖掘培育独角兽企业、专精特新“小巨人”企业。加快建设中关村世界领先科技园区，统筹“三城一区”联动发展。健全金融服务、知识产权保护等政策机…
