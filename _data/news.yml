  description: 36氪获悉，爱仕达发布异动公告，公司股票连续3个交易日收盘价格跌幅偏离值累计超过20%，属于股票交易异常波动的情况。当前公司的主营业务为炊具、小家电及工业机器人。2026年上半年，公司实现营业收入13.51亿元，归属于母公司的净利润处于亏损状态，为-9341.42万元，炊具、小家电业务占整体营收的84.46%，工业机器人占比12.20%。公司的具身智能机器人业务为新开拓业务，尚处于起步阶段，截至目前已形成的销售收入尚低，仅13.72万元，且预计该业务对公司本年度的财务状况和经营成果不会产生重大影响。此外，上述业务…
