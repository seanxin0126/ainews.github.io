- title: 台积电高管：AI无法独立设计1.4纳米级先进制程 人类工程师仍不可替代
  description: "在人工智能不断被视为改变半导体研发模式的重要工具之际，台积电高层近日公开对AI能力作出更为谨慎的评价。台积电共同营运长米玉杰表示，尽管人工智能已经能够大幅提升芯片设计和软件开发效率，但在创造下一代先进制造工艺方面，AI依然无法取代人类工程师发挥核心作用。 \r\
    \n米玉杰是在台湾大学相关活动中发表上述看法的。谈及人工智能时，他将其比喻为“一个三岁的超人”，虽然具备强大能力，但仍缺乏成熟判断力。因此，在涉及关键决策和未知领域探索时，人类仍应扮演最终决策者角色。 作为全球最先进芯片制造企业之一，台积电目前正在推进A14（1…"
