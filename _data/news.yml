- title: 蚂蚁集团入股戴盟机器人
  description: 36氪获悉，天眼查App显示，近日，戴盟（深圳）机器人科技有限公司发生工商变更，新增蚂蚁集团旗下上海云玚企业管理咨询有限公司为股东，同时，注册资本由约191.7万人民币增至约209.2万人民币。该公司成立于2021年12月，法定代表人为段江哗，经营范围含智能机器人的研发、工业机器人制造、智能机器人销售等，现由段江哗、奥利（天津）科技合伙企业（有限合伙）及上述新增股东等共同持股。
  url: https://36kr.com/newsflashes/3977176040452617?f=rss
  source: 36kr.com
- title: 映翰通：已围绕具身智能机器人开展技术研究，主要面向工业柔性制造场景
  description: 映翰通在9月10日召开的2026年半年度网上业绩说明会上表示，公司目前已围绕具身智能机器人开展前瞻性技术研究，重点布局3D视觉识别、灵巧执行器、运动控制及自主学习等底层技术，主要面向工业柔性制造场景。该项目目前仍处于研发和技术储备阶段，公司将结合技术成熟度及市场需求持续推进相关研发投入。此外，公司未来还将重点围绕AI+物联网持续投入，重点布局AI边缘计算、AI车载视觉方案、AI原生路由器、AI
    Agent及云平台智能化等方向。目前部分项目已进入产品发布、客户验证和市场导入阶段，公司也在持续推动AI技术与企业网络、…
  url: https://36kr.com/newsflashes/3977223712403977?f=rss
  source: 36kr.com
- title: 美司法部据悉对英伟达与Groq巨额交易展开反垄断调查
  description: '据《纽约时报》9月9日援引两名知情人士的话报道，美国司法部正在调查英伟达公司是否试图规避反垄断审查，这一调查涉及英伟达去年与人工智能芯片初创公司Groq达成的交易。去年12月，英伟达宣布与Groq达成一项价值170亿美元的交易。根据协议，英伟达获得Groq芯片技术的非排他性授权，同时吸纳了包括Groq创始人乔纳森·罗斯在内的部分高管。（界面）


    美监管机构指出，这类“变相收购”行为会扼杀AI芯片行业的市场竞争，进一步强化英伟达在该领域的主导地位。'
  url: https://36kr.com/newsflashes/3977218677698816?f=rss
  source: 36kr.com
- title: OpenAI推出专为金融业者打造的人工智能工具
  description: OpenAI推出面向投资银行家和股票研究员的新工具ChatGPT for Financial Services。该公司周四在一篇博客文章中写到，这款产品将把Daloopa、PitchBook和LSEG
    News等来源的内置数据，与最新的GPT-6 Astra模型结合起来。随着公司推出更新的人工智能模型，这项服务也将使用这些新模型。OpenAI希望借助这款工具吸引到大型金融机构，持续扩大企业客户占比。（新浪财经）
  url: https://36kr.com/newsflashes/3978205964745734?f=rss
  source: 36kr.com
- title: AMD投资的韩国AI初创企业Upstage考虑进行IPO前融资
  description: 据联合创始人透露，韩国人工智能初创公司Upstage正考虑开展上市前融资，这是其多项资本市场备选方案之一。这家总部位于首尔的企业今年完成了5600亿韩元（合4.2亿美元）的C轮融资，累计融资总额达7300亿韩元。公司已获得超威半导体（AMD）的战略合作与战略投资，但由于人工智能赛道硬件投入巨大，其资金需求持续攀升。（新浪财经）
  url: https://36kr.com/newsflashes/3977063532015881?f=rss
  source: 36kr.com
- title: OpenAI呼吁美国制定强制性全国AI安全规则，并支持四项加州法案
  description: OpenAI当地时间9月9日表示，将推动美国建立具有强制约束力、按照模型能力和风险分级的全国人工智能安全制度。公司提出，针对开发最先进模型的少数大型实验室，应设置统一的测试、独立评估、网络安全和重大事故报告要求。与此同时，OpenAI正式支持四项已经通过加州议会的人工智能法案。公司称，其中部分法案此前未获其支持，此次调整立场源于近期模型能力快速提升。（新浪财经）
  url: https://36kr.com/newsflashes/3977297827131648?f=rss
  source: 36kr.com
- title: 一年融3轮，哈工程海洋工程团队「工至海洋」打造深海机器人，已获亿元意向订单 | 水下项目
