- title: 德国等20国和欧盟发表联合声明，呼吁开展国际合作“以确保人工智能始终处于人类控制下”
  description: 据卡塔尔半岛电视台报道，德国等20个国家和欧盟当地时间21日发表联合声明，呼吁开展国际合作，以确保人工智能（AI）始终处于人类控制之下，包括可能建立一个全球监管机构来制定和执行相关标准。这20个国家分别为：挪威、芬兰、澳大利亚、巴林、加拿大、丹麦、爱沙尼亚、德国、冰岛、爱尔兰、哈萨克斯坦、肯尼亚、拉脱维亚、摩尔多瓦、荷兰、新加坡、西班牙、南非、土耳其和阿联酋。声明呼吁各国政府和业界立即采取行动，确保人工智能的发展符合国际法，并始终处于“人类的指导、监管和控制”之下。（环球网）
  url: https://36kr.com/newsflashes/3994472157450117?f=rss
  source: 36kr.com
- title: 国家发改委：将加快推动《中华人民共和国卫星导航条例》出台实施
  description: 国家发展改革委政策研究室副主任李超在发改委9月份新闻发布会上表示，为推动北斗产业规模五年内突破1万亿元，将做好以下三方面工作。一是强化顶层设计。统筹推进高端芯片、关键零部件、融合算法等关键核心技术攻关，加强北斗与人工智能、卫星互联网等技术融合创新，推动卫星导航基础设施布局更加合理，培育壮大优质企业，筑牢安全可靠的时空底座；二是优化制度保障。加快推动《中华人民共和国卫星导航条例》出台实施，健全完善行业标准体系和检测认证体系，引导有关方面加大对认证结果的采信力度，完善应用服务配套措施，夯实北斗规模应用的制度根基；三是…
