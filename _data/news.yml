- title: 亚马逊加入AI安全讨论，呼吁模型发布前严格测试
  description: 亚马逊表示，人工智能模型只有在经过严格测试后才应发布。在多家顶尖AI实验室因安全漏洞呼吁放慢开发速度后，该公司也加入了有关AI发展步伐的讨论。“我们并不认为进步与安全之间只能二选一，”亚马逊发言人Tom
    Parnell在电子邮件中表示。“模型应当在准备就绪并能够安全使用时才发布，而这需要严格测试和强有力的防护措施。如果不能共同做到这一点，就会存在风险。我们相信，作为一个行业，在与政府合作之下，我们将共同确立恰当的保护措施。”（新浪财经）
  url: https://36kr.com/newsflashes/3988108637862658?f=rss
  source: 36kr.com
