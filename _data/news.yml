- title: 光启技术：公司无人机业务已从技术验证阶段进入商业化阶段
  description: 36氪获悉，光启技术接受机构调研时表示，公司最终客户高度重视我国无人化、智能化装备的发展，公司无人机业务已经从技术验证阶段进入商业化阶段。公司近期参加了某客户组织的技术、场景测试演训，相关科目已顺利完成，产品表现获得客户认可与肯定，目前正根据演训结果反馈开展��能优化与新品研制工作，积极匹配客户后续任务需求。无人艇方面公司今年已与某合作方开展联合研制工作。另外公司在无人机反制、低空安全领域也和科研院所开展了合作，相关业务正在推进中。
  url: https://36kr.com/newsflashes/3985471101123330?f=rss
  source: 36kr.com
- title: Anthropic签署首份澳大利亚数据中心协议
  description: 据知情人士透露，美国人工智能初创公司Anthropic已签署其在澳大利亚的首份数据中心租赁协议，借势有利的政治环境和丰富的新能源资源，锁定了未来将成为全球最大计算设施之一的数据中心的容量。其中一位知情人士称，该租赁协议涵盖的数据中心园区规划总容量达2.16吉瓦，与目前全球部分最大规模的运营数据中心相当。据知情人士透露，该拟建设施位于距离布里斯班约250公里（150英里）
    的农田上，计划于2027年开始投入运营。（新浪财经）
  url: https://36kr.com/newsflashes/3985564231039752?f=rss
  source: 36kr.com
